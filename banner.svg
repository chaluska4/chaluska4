<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#08111f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="blueGlow" cx="20%" cy="85%" r="70%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow" cx="90%" cy="90%" r="70%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 58px;
        font-weight: 800;
        fill: #ffffff;
      }

      .accent {
        fill: url(#nameGradient);
      }

      .line {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 24px;
        fill: #38BDF8;
      }

      .subline {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 18px;
        fill: #93C5FD;
      }

      .small {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 16px;
        fill: #64748B;
      }

      .cursor {
        animation: blink 1s step-end infinite;
      }

      @keyframes blink {
        50% { opacity: 0; }
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
    </style>

    <linearGradient id="nameGradient" x1="510" y1="0" x2="820" y2="0">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="16" fill="url(#blueGlow)"/>
  <rect width="1200" height="280" rx="16" fill="url(#purpleGlow)"/>

  <g opacity="0.28">
    <path d="M35 210 L95 180 L150 192 L215 130 L270 150 L330 105" stroke="#2563EB" stroke-width="3"/>
    <circle cx="95" cy="180" r="4" fill="#2563EB"/>
    <circle cx="215" cy="130" r="4" fill="#2563EB"/>
    <circle cx="330" cy="105" r="4" fill="#2563EB"/>

    <path d="M890 200 L940 170 L980 178 L1025 120 L1075 90 L1140 52" stroke="#38BDF8" stroke-width="3"/>
    <circle cx="940" cy="170" r="4" fill="#38BDF8"/>
    <circle cx="1025" cy="120" r="4" fill="#38BDF8"/>
    <circle cx="1140" cy="52" r="4" fill="#38BDF8"/>
  </g>

  <g opacity="0.18">
    <rect x="55" y="70" width="9" height="50" fill="#1D4ED8"/>
    <rect x="80" y="95" width="9" height="40" fill="#1D4ED8"/>
    <rect x="105" y="60" width="9" height="65" fill="#1D4ED8"/>
    <rect x="130" y="85" width="9" height="45" fill="#1D4ED8"/>

    <rect x="1010" y="140" width="11" height="55" fill="#9333EA"/>
    <rect x="1040" y="105" width="11" height="90" fill="#9333EA"/>
    <rect x="1070" y="75" width="11" height="120" fill="#9333EA"/>
    <rect x="1100" y="125" width="11" height="70" fill="#9333EA"/>
  </g>

  <g opacity="0.20">
    <path d="M55 38 H155 M55 55 H130 M55 72 H180 M55 89 H120 M55 106 H160" stroke="#38BDF8" stroke-width="2"/>
    <path d="M1040 38 H1145 M1065 55 H1145 M1020 72 H1145 M1088 89 H1145 M1035 106 H1145" stroke="#A855F7" stroke-width="2"/>
  </g>

  <g class="float" filter="url(#glow)">
    <text x="145" y="150" font-family="JetBrains Mono, monospace" font-size="38" fill="#3B82F6">&lt;/&gt;</text>
    <text x="995" y="150" font-family="JetBrains Mono, monospace" font-size="42" fill="#A855F7">📈</text>
  </g>

  <text x="420" y="88" class="title">Colin <tspan class="accent">Haluska</tspan></text>

  <text x="420" y="135" class="line">Building financial software<tspan class="cursor"> █</tspan></text>
  <text x="420" y="170" class="line" fill="#818CF8">Automating enterprise workflows<tspan class="cursor"> █</tspan></text>
  <text x="420" y="205" class="line" fill="#C084FC">Engineering investment systems<tspan class="cursor"> █</tspan></text>

  <text x="420" y="242" class="subline">Finance • Full-Stack Development • Automation</text>
</svg>
